<div class="selector-wrap">
  <label class="selector-label">
    <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
      <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
    </svg>
    Location
  </label>

  @if (store.hasMultipleLocations()) {
    <select
      class="selector-input"
      [ngModel]="store.selectedLocationId()"
      (ngModelChange)="store.selectLocation($event)">
      <option value="" disabled [selected]="!store.selectedLocationId()">Select location…</option>
      @for (loc of store.locations(); track loc.id) {
        <option [value]="loc.id">{{ loc.name }} — {{ loc.city }}, {{ loc.state }}</option>
      }
    </select>
  } @else {
    <div class="selector-static">
      {{ store.locations()[0].name }} — {{ store.locations()[0].city }}
    </div>
  }
</div>
